<style>
:root{
  color-scheme:light;
  --page:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;
  --border:rgba(11,11,11,.10);--hover:rgba(11,11,11,.04);
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;

  --note-bg:#fff7dc;--note-edge:#eda100;--zone:rgba(12,163,12,.08);--scrim:rgba(11,11,11,.42);
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --page:#0a0d12;--surface:#161b22;--ink:#e6edf3;--ink2:#b1bac4;--muted:#7d8590;--grid:#262c36;--axis:#383b41;

    --pos:#3987e5;--neg:#e66767;--mid:#383b41;

  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0a0d12;--surface:#161b22;--ink:#e6edf3;--ink2:#b1bac4;--muted:#7d8590;--grid:#262c36;--axis:#383b41;
  --border:rgba(240,246,252,.10);--hover:rgba(240,246,252,.05);
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;
  --pos:#3987e5;--neg:#e66767;--mid:#383b41;
  --good-ink:#0ca30c;--note-bg:#1e242d;--note-edge:#c98500;--zone:rgba(12,163,12,.12);--scrim:rgba(0,0,0,.62);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
.top-in{max-width:1320px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:20px;height:48px}
.brand{display:flex;align-items:center;gap:7px;flex:none;text-decoration:none;color:var(--ink);font-size:14px;font-weight:600;letter-spacing:-.15px}
.brand svg{display:block;flex:none}
.brand b{font-weight:600;color:var(--s1)}
.nav{display:flex;gap:2px;overflow-x:auto}
.nav a{padding:13px 10px;font-size:14px;text-decoration:none;color:var(--ink2);border-bottom:2px solid transparent;white-space:nowrap}
.nav a.on{color:var(--ink);border-bottom-color:var(--ink)}
.top .right{margin-left:auto;display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;white-space:nowrap}
button{font:inherit;color:inherit}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:6px;padding:4px 10px;cursor:pointer}
.btn:hover{background:var(--hover)}
main{max-width:1320px;margin:0 auto;padding:16px 16px 80px}
h1{font-size:22px;margin:6px 0 2px}
h2{font-size:15px;margin:26px 0 8px}
.sub{color:var(--ink2);margin:0 0 12px}
.muted{color:var(--muted)}
.note{background:var(--note-bg);border-left:3px solid var(--note-edge);border-radius:4px;padding:6px 10px;margin:8px 0;font-size:12px;color:var(--ink)}
.note b{font-weight:600}
.targetline{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--ink2);font-size:12px;margin:4px 0 12px}
.targetline b{color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:10px 0}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 11px;min-width:0}
.tile .k{font-size:12px;color:var(--ink2)}
.tile .v{font-size:21px;font-weight:600;margin-top:1px;white-space:nowrap}
.tile .s{font-size:11.5px;color:var(--muted)}
.ok{color:var(--good-ink)} .bad{color:var(--crit)}
.icon-ok,.icon-bad{display:inline-block;width:14px;text-align:center;font-weight:700}
.icon-ok{color:var(--good-ink)} .icon-bad{color:var(--crit)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 12px;min-width:0}
.card h3{font-size:13px;margin:0 0 2px}
.card .cap{font-size:12px;color:var(--muted);margin:0 0 6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink2);margin:2px 0 4px}
.legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:5px;border-radius:1px}
.legend i.box{height:10px;width:10px;border-radius:2px}
.scroll{overflow:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:5px 7px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap}
th{font-weight:600;font-size:12px;color:var(--ink2);position:sticky;top:0;background:var(--surface);z-index:1;cursor:default}
td.l,th.l{text-align:left}
tbody tr:hover{background:var(--hover)}
tr.sel td{background:color-mix(in oklab,var(--s1) 7%,transparent)}
.pips{display:inline-flex;gap:2px;vertical-align:middle}
.pips i{width:7px;height:10px;border-radius:2px;background:var(--grid)}
.pips i.on{background:var(--good)}
.heat td{padding:3px 5px;text-align:center;font-size:12px}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 18px rgba(0,0,0,.14);padding:6px 9px;font-size:12px;display:none;max-width:360px}
.tip .t{color:var(--muted);margin-bottom:3px}
.tip .r{display:flex;align-items:center;gap:6px;white-space:nowrap}
.tip .r i{width:12px;height:2px;border-radius:1px;display:inline-block}
.tip .r b{font-variant-numeric:tabular-nums}
.tip .r span{color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--page);padding:7px 14px;border-radius:6px;display:none;z-index:60;font-size:12.5px}
.page{display:none}.page.on{display:block}
</style>

  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img">`;
  for (const v of ticks) s += `<line x1="${ml}" x2="${W - mr}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--grid)"/><text x="${ml - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="11" style="fill:var(--muted)">${esc(fmt(v))}</text>`;
  for (const [t, lab] of yearTicks(t0, t1, Math.max(3, Math.floor((W - ml - mr) / 60)))) s += `<text x="${X(t)}" y="${H - 5}" text-anchor="middle" font-size="11" style="fill:var(--muted)">${lab}</text>`;
  if (o.zero) s += `<line x1="${ml}" x2="${W - mr}" y1="${Y(0)}" y2="${Y(0)}" style="stroke:var(--axis)"/>`;
  for (const r of (o.refs || [])) s += `<line x1="${ml}" x2="${W - mr}" y1="${Y(r.v)}" y2="${Y(r.v)}" style="stroke:var(--crit);stroke-opacity:.6"/><text x="${ml + 4}" y="${Y(r.v) - 4}" font-size="11" style="fill:var(--ink2)">${esc(r.label)}</text>`;
  const ends = [];
  for (const se of series) {
    const step = Math.max(1, Math.floor(se.pts.length / 900)); const pts = se.pts.filter((_, i) => i % step === 0 || i === se.pts.length - 1);
    const line = pts.map(p => X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1)).join(' ');
    if (o.area) s += `<polygon points="${X(pts[0][0]).toFixed(1)},${Y(0)} ${line} ${X(pts[pts.length - 1][0]).toFixed(1)},${Y(0)}" style="fill:var(${se.color});fill-opacity:.12"/>`;
    s += `<polyline points="${line}" style="fill:none;stroke:var(${se.color});stroke-width:${se.w || 2};stroke-linejoin:round;stroke-linecap:round${se.dash ? ';stroke-dasharray:' + se.dash : ''}${se.faint ? ';stroke-opacity:.55' : ''}"/>`;
    const last = se.pts[se.pts.length - 1]; ends.push({y: Y(last[1]), x: X(last[0]), name: se.name, v: last[1], color: se.color});
  }
  if (o.endLabels !== false) { ends.sort((a, b) => a.y - b.y);
    ends.forEach((e, i) => { e.ly = i ? Math.max(e.y, ends[i - 1].ly + 14) : e.y; });
    for (const e of ends) { s += `<line x1="${e.x + 2}" x2="${W - mr + 8}" y1="${e.y}" y2="${e.ly}" style="stroke:var(--axis)"/><circle cx="${e.x}" cy="${e.y}" r="3.5" style="fill:var(${e.color});stroke:var(--surface);stroke-width:2"/><text x="${W - mr + 11}" y="${e.ly + 4}" font-size="11" style="fill:var(--ink2)">${esc(endName(e.name))} <tspan style="fill:var(--ink);font-weight:600">${esc(fmt(e.v))}</tspan></text>`; } }
  s += `<line class="xh" x1="0" x2="0" y1="${mt}" y2="${H - mb}" style="stroke:var(--muted);display:none"/><g class="dots"></g><rect x="${ml}" y="${mt}" width="${W - ml - mr}" height="${H - mt - mb}" fill="transparent" class="hit"/></svg>`;
  el.innerHTML = s;
  const svg = el.querySelector('svg'), xh = svg.querySelector('.xh'), dots = svg.querySelector('.dots');
  svg.querySelector('.hit').addEventListener('pointermove', ev => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width, t = t0 + (px - ml) / (W - ml - mr) * (t1 - t0);
    xh.setAttribute('x1', px); xh.setAttribute('x2', px); xh.style.display = '';
    let rowsH = '', dh = '';
    for (const se of series) { if (t < se.pts[0][0] || t > se.pts[se.pts.length - 1][0]) continue; const p = se.pts[bisect(se.pts, t)];
      dh += `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="4" style="fill:var(${se.color});stroke:var(--surface);stroke-width:2"/>`;
      rowsH += tipRow(`var(${se.color})`, fmt(p[1]), se.name); }
    dots.innerHTML = dh; showTip(ev, `<div class="t">${ymd(t)}</div>` + rowsH);
  });
  svg.querySelector('.hit').addEventListener('pointerleave', () => { xh.style.display = 'none'; dots.innerHTML = ''; hideTip(); });
}
function legend(items, box) { return '<div class="legend">' + items.map(([c, n]) => `<span><i class="${box ? 'box' : ''}" style="background:var(${c})"></i>${esc(n)}</span>`).join('') + '</div>'; }

// stacked share area: classes, pts [[t, a, b, ...]]
function stackChart(el, classes, pts, colors) { CHARTS.push(() => drawStack(el, classes, pts, colors)); drawStack(el, classes, pts, colors); }
function drawStack(el, classes, pts, colors) {
  const W = el.clientWidth || 600, H = 200, ml = 40, mr = 12, mt = 8, mb = 22, t0 = pts[0][0], t1 = pts[pts.length - 1][0];
  const X = t => ml + (t - t0) / (t1 - t0) * (W - ml - mr), Y = v => mt + (1 - v) * (H - mt - mb);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`;
  for (const v of [0, .25, .5, .75, 1]) s += `<line x1="${ml}" x2="${W - mr}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--grid)"/><text x="${ml - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="11" style="fill:var(--muted)">${v * 100}%</text>`;
  for (const [t, lab] of yearTicks(t0, t1, 10)) s += `<text x="${X(t)}" y="${H - 5}" text-anchor="middle" font-size="11" style="fill:var(--muted)">${lab}</text>`;
  const cum = pts.map(p => { let acc = 0; return [p[0], ...p.slice(1).map(v => (acc += (v || 0)))]; });
  for (let k = classes.length - 1; k >= 0; k--) {
    const top = cum.map(p => `${X(p[0]).toFixed(1)},${Y(p[k + 1]).toFixed(1)}`), bot = cum.map(p => `${X(p[0]).toFixed(1)},${Y(k ? p[k] : 0).toFixed(1)}`).reverse();
    s += `<polygon points="${top.join(' ')} ${bot.join(' ')}" style="fill:var(${colors[k]});fill-opacity:.6;stroke:var(--surface);stroke-width:1"/>`;
  }
  s += `<line class="xh" y1="${mt}" y2="${H - mb}" style="stroke:var(--ink);display:none"/><rect x="${ml}" y="${mt}" width="${W - ml - mr}" height="${H - mt - mb}" fill="transparent" class="hit"/></svg>`;
  el.innerHTML = s;
  const svg = el.querySelector('svg'), xh = svg.querySelector('.xh');
  svg.querySelector('.hit').addEventListener('pointermove', ev => { const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width;
    const t = t0 + (px - ml) / (W - ml - mr) * (t1 - t0), p = pts[bisect(pts, t)]; xh.setAttribute('x1', X(p[0])); xh.setAttribute('x2', X(p[0])); xh.style.display = '';
    showTip(ev, `<div class="t">${ymd(p[0]).slice(0, 7)}</div>` + classes.map((c, k) => tipRow(`var(${colors[k]})`, pct0(p[k + 1]), c)).reverse().join('')); });
  svg.querySelector('.hit').addEventListener('pointerleave', () => { xh.style.display = 'none'; hideTip(); });
}

function monthlyTable(m) {
  const mn = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  return '<div class="scroll"><table class="heat"><thead><tr><th class="l">year</th>' + mn.map(x => `<th>${x}</th>`).join('') + '<th>year</th></tr></thead><tbody>' +
    m.years.map(y => `<tr><td class="l">${y.year}</td>` + y.months.map(v => `<td style="${divBg(v, 0.06)}">${isNum(v) ? (v * 100).toFixed(1) : ''}</td>`).join('') +
      `<td style="${divBg(y.total, 0.3)}"><b>${isNum(y.total) ? (y.total * 100).toFixed(1) : ''}</b></td></tr>`).join('') + '</tbody></table></div>';
}

// ------------------------------------------------------------------ portfolios
function renderPortfolios() {
  const P = D.portfolio, el = $('#p-portfolios'), sel = P.variants.find(v => v.name === P.selected);
  const how = v => (v.name.startsWith('candidates') ? 'Candidates only' : 'All evaluated') + ' · ' + (v.method === 'equal_risk' ? 'equal risk' : v.method) + (v.sel ? ` · keep members with positive trailing ${v.sel}-day Sharpe` : '') + (v.top_k ? ` · best ${v.top_k}` : '');
  const tile = (k, v, s, ok) => `<div class="tile"><div class="k">${k}</div><div class="v ${ok == null ? '' : ok ? 'ok' : 'bad'}">${v}${ok == null ? '' : ' ' + (ok ? '✓' : '✗')}</div><div class="s">${s}</div></div>`;
  const colors = ['--s1', '--s2', '--s3', '--s4', '--s5'];
  el.innerHTML = `
  <h1>Portfolios</h1>
  <p class="sub">Strategies combined into one pot of capital (weights sum to 1, no leverage), members and weights fixed each month from data before it. A portfolio is judged on all months: a month the money earned nothing is not green for its owner. Span ${esc(sel.start)} → ${esc(sel.end)}.</p>
  <div class="card" style="padding:0"><div class="scroll"><table><thead><tr><th class="l">portfolio</th><th>members</th><th>held on average</th><th>avg / month</th><th>green months</th><th>max DD</th><th>Sharpe</th><th>worst month</th><th>targets</th></tr></thead><tbody>
    ${P.variants.map(v => `<tr class="${v.name === P.selected ? 'sel' : ''}"><td class="l">${esc(how(v))}</td><td>${v.members}</td><td>${v.held}</td><td>${pct(v.avg_monthly)} ${mark(v.targets['avg_monthly>=1.5%'])}</td><td>${pct0(v.green)} ${mark(v.targets['green_months>=70%'])}</td><td>${pct(v.max_dd, 1)} ${mark(v.targets['max_dd>=-10%'])}</td><td>${n2(v.sharpe)} ${mark(v.targets['sharpe>=1'])}</td><td>${pct(v.worst_month, 1)}</td><td>${pips(v.targets_met)}</td></tr>`).join('')}</tbody></table></div></div>
  <h2>${esc(how(sel))}</h2>
  <div class="tiles">
    ${tile('Avg / month', pct(sel.avg_monthly), 'target ≥ 1.5%', sel.targets['avg_monthly>=1.5%'])}
    ${tile('Green months', pct0(sel.green), 'of all months · target ≥ 70%', sel.targets['green_months>=70%'])}
    ${tile('Max drawdown', pct(sel.max_dd, 1), 'target ≥ −10%', sel.targets['max_dd>=-10%'])}
    ${tile('Sharpe', n2(sel.sharpe), 'target ≥ 1', sel.targets['sharpe>=1'])}
    ${tile('$10k became', money(P.ten_k), 'CAGR ' + pct(sel.cagr, 1), null)}
    ${tile('Held on average', sel.held, 'of ' + sel.members + ' candidate series', null)}
  </div>
  <div class="grid2">
    <div class="card"><h3>Equity, $10k start</h3><div class="chart" id="p-eq"></div><h3 style="margin-top:10px">Drawdown</h3><div class="chart" id="p-dd"></div></div>
    <div class="card"><h3>Where the money is, by asset class</h3><p class="cap">share of capital at each month start · the empty top is capital not invested that month</p>${legend(P.alloc.classes.map((c, k) => [colors[k], c]), true)}<div class="chart" id="p-al"></div></div>
  </div>
  <div class="note"><b>Why:</b> one strategy alone may not reach the target where a portfolio across asset classes may. This page shows whether the combination reaches the target and where its money goes. <b>Data:</b> none: a mockup, its figures those of the research of 27.09, kept as they were.</div>
  <h2>Calendar months, %</h2><div class="card">${monthlyTable(P.monthly)}</div>`;
  timeChart($('#p-eq'), [{name: 'portfolio', color: '--s1', pts: P.equity}], {fmt: money, height: 230});
  timeChart($('#p-dd'), [{name: 'drawdown', color: '--neg', pts: P.dd}], {fmt: v => pct(v, 1), height: 120, area: true, zero: true, endLabels: false, refs: [{v: T.max_dd, label: 'target −10%'}]});
  stackChart($('#p-al'), P.alloc.classes, P.alloc.pts, colors);
}

// ------------------------------------------------------------------ router
const RENDER = {portfolios: renderPortfolios};
function route() { const page = 'portfolios';
  document.querySelectorAll('.page').forEach(s => s.classList.toggle('on', s.id === 'p-' + page));
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.p === page));
  CHARTS.length = 0; RENDER[page](); scrollTo(0, 0); }
addEventListener('hashchange', route);
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => CHARTS.forEach(f => f()), 150); });
$('#theme').onclick = () => { const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; };
if (/theme=(dark|light)/.test(location.search)) document.documentElement.dataset.theme = location.search.match(/theme=(dark|light)/)[1];
$('#fresh').textContent = `results ${D.meta.updated}`;
route();
</script>
</body>
